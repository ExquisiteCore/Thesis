name: build-test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  dotnet:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore ThesisTool.slnx
      - run: dotnet build ThesisTool.slnx --configuration Release --no-restore
      - run: dotnet test tests/Thesis.Tests/Thesis.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Thesis.Tests/TestResults/

  profile-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test profile-viewer/profile-viewer.test.mjs

  layout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyMuPDF==2.0
      - run: python -m unittest discover -s tests/layout -v
