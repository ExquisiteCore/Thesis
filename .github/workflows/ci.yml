name: build-test

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Thesis.Cli.slnf
      - run: dotnet build Thesis.Cli.slnf --configuration Release --no-restore
      - run: dotnet test tests/Thesis.Tests/Thesis.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=tests.trx" --collect "XPlat Code Coverage"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: tests/Thesis.Tests/TestResults/

  profile-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test profile-viewer/profile-viewer.test.mjs

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet build Thesis.slnx --configuration Release
      - name: Exercise native desktop workflow
        shell: pwsh
        run: ./tools/test-desktop.ps1 -ArtifactsDirectory artifacts/desktop-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke
          path: artifacts/desktop-smoke/run-*/

  layout-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install PyMuPDF==2.0
      - run: python -m unittest discover -s tests/layout -v

  compose-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-liberation
      - run: python -m pip install PyMuPDF==2.0
      - run: dotnet build src/Thesis.Cli/Thesis.Cli.csproj --configuration Release
      - run: python tests/integration/test_compose.py --cli src/Thesis.Cli/bin/Release/net10.0/Thesis.Cli.dll --artifacts integration-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-integration
          path: integration-artifacts/
